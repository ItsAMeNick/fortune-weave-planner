name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs to write Pages and mint an ID token for it.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Pages must be switched on once by hand (Settings -> Pages -> Source:
      # GitHub Actions); the workflow token is not allowed to create the site.
      # After that this step just reads the existing configuration.
      - uses: actions/configure-pages@v5

      # The site is plain static files at the repo root — no build step.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
